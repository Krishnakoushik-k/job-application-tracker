spring.application.name=job-application-tracker
server.port=${SERVER_PORT:8080}

# Optionally load ../.env (project root) when running from the backend/ folder.
# Real environment variables always win. Missing file is ignored (e.g. inside Docker).
spring.config.import=optional:file:../.env[.properties]

# --- Database (no credentials in source control: supplied via environment) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_tracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# "none": the schema is owned by database/schema.sql. Override with DDL_AUTO for experiments only.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# --- Application settings ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.timezone=${APP_TIMEZONE:UTC}

# --- Actuator: expose only the health endpoint, without details ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- OpenAPI / Swagger UI ---
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

# --- Responses ---
server.error.include-message=never
server.error.include-stacktrace=never
